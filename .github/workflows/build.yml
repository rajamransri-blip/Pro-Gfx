name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"

      # 1. Boilerplate generate karega
      - name: Generate Flutter Boilerplate
        run: flutter create --project-name gaming_tool --org com.raaz.gaming .

      # 2. Min SDK Fix (API 24 for Shizuku)
      - name: Fix minSdkVersion for Shizuku
        run: sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle

      # 3. Shizuku API inject
      - name: Inject Shizuku API into build.gradle
        run: |
          echo "dependencies {" >> android/app/build.gradle
          echo "    implementation 'dev.rikka.shizuku:api:12.1.0'" >> android/app/build.gradle
          echo "    implementation 'dev.rikka.shizuku:provider:12.1.0'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      # 4. Delete All Duplicates Before Copying!
      - name: Copy Custom MainActivity & Remove Duplicates
        run: |
          # Pehle se maujood kisi bhi MainActivity ko delete karo
          find android/app/src/main/kotlin/ -name "MainActivity.kt" -type f -delete
          
          # Sahi folder banao aur custom file copy karo
          mkdir -p android/app/src/main/kotlin/com/raaz/gaming/gaming_tool/
          cp MainActivity_custom.kt android/app/src/main/kotlin/com/raaz/gaming/gaming_tool/MainActivity.kt

      # 🛠️ 5. YAHAN FIX HAI: Auto Permission Injection
      - name: Auto Inject AndroidManifest (Permissions & Shizuku)
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.raaz.gaming.gaming_tool">
              
              <!-- ALL REQUIRED PERMISSIONS INJECTED AUTOMATICALLY -->
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              
              <application
                  android:label="gaming_tool"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
                  
                  <!-- SHIZUKU V3 SUPPORT INJECTED -->
                  <meta-data android:name="moe.shizuku.client.V3_SUPPORT" android:value="true" />
              </application>
          </manifest>
          EOF

      # 6. Final Build!
      - name: Install Dependencies & Build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gamer-Pro-App
          path: build/app/outputs/flutter-apk/app-release.apk
