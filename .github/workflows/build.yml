name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"

      - name: Generate Flutter Boilerplate
        run: flutter create --project-name gaming_tool --org com.raaz.gaming .

      - name: Fix minSdkVersion for Shizuku & Firebase
        run: sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle

      # ✅ SMART JSON HANDLER (No EOF Errors & Detects your local file)
      - name: Configure Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f "android/app/google-services.json" ]; then
            echo "✅ Awesome! google-services.json already exists in your repo. Skipping generation."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "✅ Injecting Real Google Services JSON from GitHub Secrets"
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "⚠️ Secret empty & file missing! Creating a fallback JSON to prevent crash..."
            echo '{"project_info":{"project_number":"123","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.raaz.gaming.gaming_tool"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

      - name: Inject Firebase and Shizuku to Gradle
        run: |
          echo -e "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.google.gms:google-services:4.4.1'\n    }\n}\n$(cat android/build.gradle)" > android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          echo "dependencies {" >> android/app/build.gradle
          echo "    implementation platform('com.google.firebase:firebase-bom:33.1.0')" >> android/app/build.gradle
          echo "    implementation 'com.google.firebase:firebase-database'" >> android/app/build.gradle
          echo "    implementation 'dev.rikka.shizuku:api:12.1.0'" >> android/app/build.gradle
          echo "    implementation 'dev.rikka.shizuku:provider:12.1.0'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      # 🚀 GENERATE NATIVE KOTLIN CODE (Fixed EOF syntax)
      - name: Create Custom Native Kotlin Files
        run: |
          find android/app/src/main/kotlin/ -name "MainActivity.kt" -type f -delete
          mkdir -p android/app/src/main/kotlin/com/raaz/gaming/gaming_tool/
          
          echo 'package com.raaz.gaming.gaming_tool
          import android.content.Intent
          import android.net.VpnService
          import androidx.annotation.NonNull
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import rikka.shizuku.Shizuku

          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(@NonNull flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.raaz.gaming/native").setMethodCallHandler { call, result ->
                      when (call.method) {
                          "isShizukuServiceRunning" -> result.success(Shizuku.pingBinder())
                          "checkPermission" -> result.success(Shizuku.checkSelfPermission() == android.content.pm.PackageManager.PERMISSION_GRANTED)
                          "requestPermission" -> { Shizuku.requestPermission(100); result.success(true) }
                          "executeCommand" -> {
                              val cmd = call.argument<String>("command")
                              if (cmd != null) {
                                  try {
                                      val process = Shizuku.newProcess(arrayOf("sh", "-c", cmd), null, null)
                                      process.waitFor()
                                      result.success(process.exitValue() == 0)
                                  } catch (e: Exception) { result.success(false) }
                              } else result.success(false)
                          }
                          "startVpn" -> {
                              val intent = VpnService.prepare(this)
                              if (intent != null) startActivityForResult(intent, 0)
                              else startService(Intent(this, FirewallVpnService::class.java))
                              result.success(true)
                          }
                          "stopVpn" -> {
                              stopService(Intent(this, FirewallVpnService::class.java))
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }' > android/app/src/main/kotlin/com/raaz/gaming/gaming_tool/MainActivity.kt
          
          echo 'package com.raaz.gaming.gaming_tool
          import android.net.VpnService
          import android.content.Intent
          import android.os.ParcelFileDescriptor

          class FirewallVpnService : VpnService() {
              private var vpnInterface: ParcelFileDescriptor? = null
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (vpnInterface == null) {
                      try {
                          vpnInterface = Builder()
                              .addAddress("10.0.0.2", 24)
                              .addRoute("0.0.0.0", 0)
                              .setSession("SK VIP Firewall")
                              .establish()
                      } catch (e: Exception) { e.printStackTrace() }
                  }
                  return START_STICKY
              }
              override fun onDestroy() {
                  vpnInterface?.close()
                  vpnInterface = null
                  super.onDestroy()
              }
          }' > android/app/src/main/kotlin/com/raaz/gaming/gaming_tool/FirewallVpnService.kt

      # 🚀 INJECT ANDROID MANIFEST WITH VPN PERMISSION (Fixed EOF syntax)
      - name: Auto Inject AndroidManifest (Permissions, VPN & Shizuku)
        run: |
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.raaz.gaming.gaming_tool">
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              
              <application android:label="gaming_tool" android:name="${applicationName}" android:icon="@mipmap/ic_launcher" android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter> <action android:name="android.intent.action.MAIN"/> <category android:name="android.intent.category.LAUNCHER"/> </intent-filter>
                  </activity>
                  
                  <!-- 🛡️ REAL VPN SERVICE DEFINITION -->
                  <service android:name=".FirewallVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">
                      <intent-filter> <action android:name="android.net.VpnService"/> </intent-filter>
                  </service>

                  <meta-data android:name="flutterEmbedding" android:value="2" />
                  <meta-data android:name="moe.shizuku.client.V3_SUPPORT" android:value="true" />
              </application>
          </manifest>' > android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies & Build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gamer-Pro-App
          path: build/app/outputs/flutter-apk/app-release.apk
